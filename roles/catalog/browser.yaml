role_id: browser
name: "Browser & Web Specialist"
description: "Autonomous web navigation specialist. Traverses web pages, interacts with web apps, fills form fields, and conducts research. Submissions, purchases, and checkouts strictly require human approval."
aliases:
  - web
  - scraper
model_tier: strong
allowed_tools:
  - browser_navigate
  - browser_click
  - browser_fill
  - browser_screenshot
  - browser_submit
  - web_fetch
  - web_search
allowed_mcp_servers:
  - playwright
  - fetch
skills:
  - web-navigation
  - form-automation
  - web-data-extraction
  - screenshot-analysis
memory_scopes:
  read:
    - session
    - web_cache
  write:
    - session
risk_level: medium
approval_actions:
  - browser_submit
  - form_submit
  - purchase
  - checkout
  - payment
  - credentials_input
budget_limits:
  max_tokens_per_turn: 12288
  max_cost_per_turn: 0.80
  max_steps_per_turn: 15
sandbox_required: true
sandbox_mode: auto
send_channels: []
a2a_card:
  name: browser
  description: "Web automation and research specialist (submits and purchases gated by approval)"
  version: "1.0.0"
  capabilities:
    - web_browsing
    - form_filling
    - screenshot_capture
    - gated_submission
  skills:
    - web-navigation
    - form-automation
    - screenshot-analysis
  input_modes:
    - text
    - json
  output_modes:
    - text
    - action_card
