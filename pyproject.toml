[project]
name = "yusufclaw"
version = "0.1.0"
description = "YusufClaw — personal AI agent (Python rewrite)"
readme = "PYTHON-SCAFFOLD.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "boto3>=1.34.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "openai>=1.35.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
yusufclaw = "yusufclaw.gateway.cli:cli_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["yusufclaw"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
